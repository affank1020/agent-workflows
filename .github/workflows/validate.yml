name: Validate workflow files

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python3 -m pip install -r requirements-dev.txt
      - name: Run validator regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate portable skills and references
        run: python3 scripts/validate.py
      - name: Build Prepare PR package
        run: python3 scripts/build_plugin.py --output /tmp/prepare-pr.zip --report /tmp/prepare-pr-provenance.json
      - name: Upload validated package
        uses: actions/upload-artifact@v4
        with:
          name: prepare-pr-package
          path: |
            /tmp/prepare-pr.zip
            /tmp/prepare-pr-provenance.json
          if-no-files-found: error
          retention-days: 14
